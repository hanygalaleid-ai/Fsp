name: Unity Android Build (Manual Backup)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab

concurrency:
  group: unity-android-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Unity 6.3 Android Manual Backup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Require Unity CI secrets
        shell: bash
        run: |
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured in repository Actions secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "GitHub Actions is only a manual backup pipeline. The primary FSP build pipeline is Unity Cloud Build Automation."
            exit 1
          fi

      - name: Prepare Google Play signing
        if: inputs.build_type == 'aab'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FSP_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FSP_ANDROID_KEYSTORE_PASSWORD }}
          KEYALIAS_NAME: ${{ secrets.FSP_ANDROID_KEYALIAS_NAME }}
          KEYALIAS_PASSWORD: ${{ secrets.FSP_ANDROID_KEYALIAS_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEYALIAS_NAME KEYALIAS_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name signing value is not configured in repository Actions secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          mkdir -p .ci
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .ci/fsp-upload.keystore
          test -s .ci/fsp-upload.keystore

          echo "FSP_ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/.ci/fsp-upload.keystore" >> "$GITHUB_ENV"
          echo "FSP_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "FSP_ANDROID_KEYALIAS_NAME=$KEYALIAS_NAME" >> "$GITHUB_ENV"
          echo "FSP_ANDROID_KEYALIAS_PASSWORD=$KEYALIAS_PASSWORD" >> "$GITHUB_ENV"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-6000.3.17f1-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-6000.3.17f1-Android-

      - name: Build Android APK
        if: inputs.build_type == 'apk'
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.17f1
          targetPlatform: Android
          buildMethod: Fsp.EditorTools.FspBuildCommands.BuildAndroidApk
          buildsPath: Builds/Android
          allowDirtyBuild: true

      - name: Build Android AAB
        if: inputs.build_type == 'aab'
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          FSP_ANDROID_KEYSTORE_PATH: ${{ env.FSP_ANDROID_KEYSTORE_PATH }}
          FSP_ANDROID_KEYSTORE_PASSWORD: ${{ env.FSP_ANDROID_KEYSTORE_PASSWORD }}
          FSP_ANDROID_KEYALIAS_NAME: ${{ env.FSP_ANDROID_KEYALIAS_NAME }}
          FSP_ANDROID_KEYALIAS_PASSWORD: ${{ env.FSP_ANDROID_KEYALIAS_PASSWORD }}
        with:
          unityVersion: 6000.3.17f1
          targetPlatform: Android
          buildMethod: Fsp.EditorTools.FspBuildCommands.BuildAndroidAab
          buildsPath: Builds/Android
          allowDirtyBuild: true

      - name: Set up Java for bundle verification
        if: inputs.build_type == 'aab'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Google Play AAB
        if: inputs.build_type == 'aab'
        shell: bash
        run: |
          set -euo pipefail
          AAB="Builds/Android/Fsp-release.aab"
          if [ ! -f "$AAB" ]; then
            AAB="$(find Builds/Android -type f -name '*.aab' -print -quit)"
          fi
          if [ -z "${AAB:-}" ] || [ ! -f "$AAB" ]; then
            echo "::error::Release AAB was not produced."
            exit 1
          fi

          jarsigner -verify -strict "$AAB"
          mkdir -p .ci
          curl -fsSL https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o .ci/bundletool.jar
          java -jar .ci/bundletool.jar validate --bundle="$AAB"

          ALIGNMENT="$(java -jar .ci/bundletool.jar dump config --bundle="$AAB" | grep -Eo 'PAGE_ALIGNMENT_(4K|16K)' | head -n1 || true)"
          if [ "$ALIGNMENT" != "PAGE_ALIGNMENT_16K" ]; then
            echo "::error::Expected PAGE_ALIGNMENT_16K, got ${ALIGNMENT:-UNKNOWN}."
            exit 1
          fi

      - name: Remove temporary signing material
        if: always() && inputs.build_type == 'aab'
        shell: bash
        run: rm -rf .ci

      - name: Upload Android artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fsp-android-${{ github.run_number }}
          path: Builds/Android/**
          if-no-files-found: error
          retention-days: 14
