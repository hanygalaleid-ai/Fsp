name: Unity Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
  push:
    branches: [ main ]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/unity-android-build.yml'

jobs:
  android:
    name: Unity 6.3 Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Unity license secrets
        id: license
        shell: bash
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Unity CI is prepared, but UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD are not all configured as repository secrets."
          fi

      - name: Cache Unity Library
        if: steps.license.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-6000.3.17f1-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-6000.3.17f1-Android-

      - name: Build Android APK
        if: steps.license.outputs.ready == 'true' && (github.event_name == 'push' || inputs.build_type == 'apk')
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.17f1
          targetPlatform: Android
          buildMethod: Fsp.EditorTools.FspBuildCommands.BuildAndroidApk
          buildsPath: Builds/Android
          allowDirtyBuild: true

      - name: Build Android AAB
        if: steps.license.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.build_type == 'aab'
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.17f1
          targetPlatform: Android
          buildMethod: Fsp.EditorTools.FspBuildCommands.BuildAndroidAab
          buildsPath: Builds/Android
          allowDirtyBuild: true

      - name: Upload Android artifacts
        if: steps.license.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fsp-android-${{ github.run_number }}
          path: Builds/Android/**
          if-no-files-found: error
          retention-days: 14

      - name: License configuration notice
        if: steps.license.outputs.ready != 'true'
        run: |
          echo "Unity build skipped because repository Unity license secrets are not configured."
          echo "Required secrets: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD."
