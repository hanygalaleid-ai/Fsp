name: Unity Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab

jobs:
  android:
    name: Unity 6.3 Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Require Unity CI secrets
        shell: bash
        run: |
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured in repository Actions secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "See Docs/UNITY_CI_SETUP.md for the Unity Personal setup flow."
            exit 1
          fi

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-6000.3.17f1-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-6000.3.17f1-Android-

      - name: Build Android APK
        if: inputs.build_type == 'apk'
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.17f1
          targetPlatform: Android
          buildMethod: Fsp.EditorTools.FspBuildCommands.BuildAndroidApk
          buildsPath: Builds/Android
          allowDirtyBuild: true

      - name: Build Android AAB
        if: inputs.build_type == 'aab'
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.17f1
          targetPlatform: Android
          buildMethod: Fsp.EditorTools.FspBuildCommands.BuildAndroidAab
          buildsPath: Builds/Android
          allowDirtyBuild: true

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fsp-android-${{ github.run_number }}
          path: Builds/Android/**
          if-no-files-found: error
          retention-days: 14
