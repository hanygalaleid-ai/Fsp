name: Install BMG HQ 2D Art

on:
  push:
    branches:
      - staging/bmg-hq2d-transfer-2026-08-22-1
    paths:
      - 'BMG_HQ_2D_APPROVED_2026-08-22.zip'
      - '.github/workflows/install-bmg-hq2d.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify transfer package exists
        run: test -f BMG_HQ_2D_APPROVED_2026-08-22.zip

      - name: Extract approved HQ art
        run: |
          rm -rf /tmp/bmg_hq2d
          mkdir -p /tmp/bmg_hq2d
          unzip -q BMG_HQ_2D_APPROVED_2026-08-22.zip -d /tmp/bmg_hq2d
          test -f /tmp/bmg_hq2d/BMG_HQ_2D_APPROVED/UI/bmg_lobby_modern.jpg
          test -f /tmp/bmg_hq2d/BMG_HQ_2D_APPROVED/Characters/bmg_characters_6_atlas.jpg
          test -f /tmp/bmg_hq2d/BMG_HQ_2D_APPROVED/Weapons/bmg_weapons_5_atlas.jpg

      - name: Verify exact approved SHA256
        run: |
          echo '9f4626c532bf369c6723e6ef5834eea1aaa8b2ec8b4ac1cc183b74575e52903a  /tmp/bmg_hq2d/BMG_HQ_2D_APPROVED/UI/bmg_lobby_modern.jpg' | sha256sum -c -
          echo '43343c86884a573d7aa59576f4d76c96f961fadf29c2bedbdf74bce5a586c3b6  /tmp/bmg_hq2d/BMG_HQ_2D_APPROVED/Characters/bmg_characters_6_atlas.jpg' | sha256sum -c -
          echo 'de6ca146196a177517f655d1f63bc1df944257ea24efa79777544199bad5dcca  /tmp/bmg_hq2d/BMG_HQ_2D_APPROVED/Weapons/bmg_weapons_5_atlas.jpg' | sha256sum -c -

      - name: Install into Unity Resources
        run: |
          mkdir -p Assets/Fsp/Art/Resources/BMG/UI
          mkdir -p Assets/Fsp/Art/Resources/BMG/Characters
          mkdir -p Assets/Fsp/Art/Resources/BMG/Weapons
          cp /tmp/bmg_hq2d/BMG_HQ_2D_APPROVED/UI/bmg_lobby_modern.jpg Assets/Fsp/Art/Resources/BMG/UI/bmg_lobby_modern.jpg
          cp /tmp/bmg_hq2d/BMG_HQ_2D_APPROVED/Characters/bmg_characters_6_atlas.jpg Assets/Fsp/Art/Resources/BMG/Characters/bmg_characters_6_atlas.jpg
          cp /tmp/bmg_hq2d/BMG_HQ_2D_APPROVED/Weapons/bmg_weapons_5_atlas.jpg Assets/Fsp/Art/Resources/BMG/Weapons/bmg_weapons_5_atlas.jpg
          rm -f BMG_HQ_2D_APPROVED_2026-08-22.zip

      - name: Verify installed byte sizes
        run: |
          test $(stat -c%s Assets/Fsp/Art/Resources/BMG/UI/bmg_lobby_modern.jpg) -eq 142668
          test $(stat -c%s Assets/Fsp/Art/Resources/BMG/Characters/bmg_characters_6_atlas.jpg) -eq 151532
          test $(stat -c%s Assets/Fsp/Art/Resources/BMG/Weapons/bmg_weapons_5_atlas.jpg) -eq 46847

      - name: Commit exact HQ assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Fsp/Art/Resources/BMG/UI/bmg_lobby_modern.jpg \
                  Assets/Fsp/Art/Resources/BMG/Characters/bmg_characters_6_atlas.jpg \
                  Assets/Fsp/Art/Resources/BMG/Weapons/bmg_weapons_5_atlas.jpg \
                  BMG_HQ_2D_APPROVED_2026-08-22.zip
          git diff --cached --quiet && exit 0
          git commit -m 'Install approved BMG HQ 2D art byte-for-byte'
          git push origin HEAD:staging/bmg-hq2d-transfer-2026-08-22-1
