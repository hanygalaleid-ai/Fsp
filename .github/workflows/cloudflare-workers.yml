name: Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy workers after validation
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-workers.yml'

jobs:
  validate-match-relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/match-relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx wrangler check

  deploy-match-relay:
    if: ${{ github.event_name == 'push' || inputs.deploy }}
    needs: [validate-match-relay]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/match-relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Cloudflare secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
      - run: npm install
      - name: Deploy match relay
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  validate-voice-worker:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: cloudflare/voice-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check voice configuration placeholders
        shell: bash
        run: |
          if grep -q 'REPLACE_WITH_KV_NAMESPACE_ID\|REPLACE_IN_DEPLOYMENT' wrangler.jsonc; then
            echo "::warning::Voice worker still needs Cloudflare KV/RealtimeKit identifiers; skipping deploy readiness."
            exit 0
          fi
          npx wrangler check

  deploy-voice-worker:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    needs: [validate-voice-worker]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/voice-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Block placeholder voice deployment
        shell: bash
        run: |
          if grep -q 'REPLACE_WITH_KV_NAMESPACE_ID\|REPLACE_IN_DEPLOYMENT' wrangler.jsonc; then
            echo "::error::Voice worker configuration is incomplete. Configure KV namespace, Cloudflare account, and RealtimeKit app before deployment."
            exit 1
          fi
      - name: Require Cloudflare secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
      - run: npm install
      - name: Deploy voice worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
