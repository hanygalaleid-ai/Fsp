name: Export BMG Source Snapshot

on:
  push:
    branches:
      - bmg/build149-authored-3d
    paths-ignore:
      - 'export/**'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Create clean source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          git archive --format=zip --output=export/Fsp_BMG_build149_clean_source.zip HEAD

      - name: Publish source ZIP on branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f export/Fsp_BMG_build149_clean_source.zip
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Export cleaned BMG source ZIP [skip export]"
          git push

      - name: Upload source ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fsp_BMG_build149_clean_source
          path: export/Fsp_BMG_build149_clean_source.zip
          if-no-files-found: error
          retention-days: 7
